# Deploy containerizado completo (Coolify). O app roda migrações + seed no start,
# depois serve na porta 3000. Arquivos enviados persistem no volume `storage`.
#
# DOIS DOMÍNIOS (roteamento manual via labels de Traefik — ver bloco `labels`):
#   - O campo "Domains" do serviço no Coolify deve ficar VAZIO; quem roteia e
#     certifica são os labels abaixo (evita roteador concorrente que rouba o
#     cert default e deixa o secundário sem SSL).
#   - O cert Let's Encrypt cobre os dois domínios via `tls.domains` (main+sans).
#   - APP_URL deve ser o domínio canônico (usado em links absolutos/e-mails/OG).
#   - Como auth usa trustHost, os cookies/callbacks seguem o domínio acessado —
#     mas isso só funciona com HTTPS válido nos DOIS domínios (senão o NextAuth
#     monta redirect_uri http:// e o Google bloqueia com erro 400).
#   - No Google Cloud, cadastre o callback HTTPS dos DOIS domínios:
#       https://retro.wiki.br/api/auth/callback/google
#       https://retrowiki.com.br/api/auth/callback/google
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      # Domínio canônico (um dos dois) — usado em URLs absolutas.
      APP_URL: ${APP_URL:-https://retro.wiki.br}
      # Deploy opcional em subdiretório; vazio para subdomínio.
      BASE_PATH: ${BASE_PATH:-}
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      AUTH_SECRET: ${AUTH_SECRET}
      CAPTCHA_SECRET: ${CAPTCHA_SECRET}
      STORAGE_DIR: /app/storage
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-RetroWiki <noreply@localhost>}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      # Login com Google (OAuth) — opcional.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # BunnyCDN (uploads de imagem) — opcional; sem isso usa o storage local.
      BUNNY_STORAGE_KEY: ${BUNNY_STORAGE_KEY:-}
      BUNNY_STORAGE_KEY_READONLY: ${BUNNY_STORAGE_KEY_READONLY:-}
      BUNNY_STORAGE_REGION: ${BUNNY_STORAGE_REGION:-}
      BUNNY_PULL_ZONE: ${BUNNY_PULL_ZONE:-}
      BUNNY_CDN_TOKEN: ${BUNNY_CDN_TOKEN:-}
      BUNNY_CDN_URL: ${BUNNY_CDN_URL:-}
    volumes:
      - storage:/app/storage
    expose:
      - "3000"
    # ROTEAMENTO MANUAL (Traefik). Para os DOIS domínios funcionarem com SSL:
    #   1) NÃO cadastre estes domínios no campo "Domains" do serviço no Coolify —
    #      senão o Coolify gera um roteador concorrente que rouba o cert default.
    #      Deixe o campo Domains VAZIO; quem roteia/certifica são estes labels.
    #   2) `certresolver` precisa bater com o nome real do resolver do SEU Traefik
    #      (no Coolify o padrão é `letsencrypt`). Confira em outro serviço que já
    #      tem SSL ou no traefik.yml do Coolify se for diferente.
    #   3) O certificado é declarado EXPLICITAMENTE via `tls.domains` (main+sans)
    #      porque o Traefik nem sempre extrai os dois hosts de uma regra
    #      `Host(a) || Host(b)` — era isso que deixava o secundário sem SSL.
    labels:
      - "traefik.enable=true"
      # Garante que o Traefik fale com o app pela rede do proxy do Coolify.
      - "traefik.docker.network=coolify"
      # Um único serviço apontando para a porta interna do app.
      - "traefik.http.services.retrowiki.loadbalancer.server.port=3000"
      # Middlewares (nomes próprios pra não colidir com os globais do Coolify).
      - "traefik.http.middlewares.retrowiki-gzip.compress=true"
      - "traefik.http.middlewares.retrowiki-https.redirectscheme.scheme=https"
      # Router HTTP -> redireciona para HTTPS.
      - "traefik.http.routers.retrowiki-http.entryPoints=http"
      - "traefik.http.routers.retrowiki-http.rule=Host(`retro.wiki.br`) || Host(`retrowiki.com.br`)"
      - "traefik.http.routers.retrowiki-http.middlewares=retrowiki-https"
      - "traefik.http.routers.retrowiki-http.service=retrowiki"
      # Router HTTPS -> serve o app com cert Let's Encrypt cobrindo os dois domínios.
      - "traefik.http.routers.retrowiki-https.entryPoints=https"
      - "traefik.http.routers.retrowiki-https.rule=Host(`retro.wiki.br`) || Host(`retrowiki.com.br`)"
      - "traefik.http.routers.retrowiki-https.middlewares=retrowiki-gzip"
      - "traefik.http.routers.retrowiki-https.service=retrowiki"
      - "traefik.http.routers.retrowiki-https.tls=true"
      - "traefik.http.routers.retrowiki-https.tls.certresolver=letsencrypt"
      # Domínios do certificado declarados explicitamente (correção do SSL).
      - "traefik.http.routers.retrowiki-https.tls.domains[0].main=retro.wiki.br"
      - "traefik.http.routers.retrowiki-https.tls.domains[0].sans=retrowiki.com.br"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  storage:
  mysql_data:
